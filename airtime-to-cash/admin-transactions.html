<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cashify Admin - Transactions</title>

<link rel="stylesheet" href="css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="admin-layout">

<!-- Sidebar -->

<div class="sidebar">

<div class="logo">

Cashify <span>Admin</span>

</div>

<nav>

<a href="admin.html">
    Dashboard
</a>

<a href="admin-transactions.html" class="active">
    Transactions
</a>

<a href="admin-users.html">
    Users
</a>

<a href="admin-withdrawals.html">
    Withdrawals
</a>
  
<a href="admin-settings.html">
    Settings
</a>

</nav>

<div class="logout">

<button onclick="logout()">

Logout

</button>

</div>

</div>

<!-- Main -->

<div class="main">

<div class="topbar">

<h2>Transactions</h2>

<input
type="text"
id="searchTransaction"
placeholder="Search transaction...">

</div>

<div class="section">

<table>

<thead>

<tr>

<th>ID</th>

<th>User</th>

<th>Network</th>

<th>Amount</th>

<th>Status</th>

<th>Screenshot</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="transactionTable">

</tbody>

</table>

</div>

</div>

</div>

<script src="js/admin.js"></script>

</body>

</html>
